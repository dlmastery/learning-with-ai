<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Explanation depth ladder with a fidelity thread</title>
  <desc id="desc">Four increasing explanation levels—concrete causal, connected representations, formal model, and expert frontier—share an unbroken thread of invariant truths. Entry is chosen by demonstrated knowledge; learners can move up, down, or sideways without unlearning false simplifications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07152f"/><stop offset="1" stop-color="#173d5d"/></linearGradient>
    <linearGradient id="step" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#163f65"/><stop offset="1" stop-color="#14655f"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020a16" flood-opacity=".5"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ffc857"/></marker>
    <style>
      .h{font:700 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}.sub{font:400 17px Inter,Segoe UI,sans-serif;fill:#bed0e3}
      .k{font:700 13px Inter,Segoe UI,sans-serif;letter-spacing:1.1px;fill:#83ead6}.t{font:700 21px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .b{font:400 14px Inter,Segoe UI,sans-serif;fill:#d8e6f1}.g{font:700 16px Inter,Segoe UI,sans-serif;fill:#10243b}
    </style>
  </defs>
  <rect width="1200" height="850" rx="34" fill="url(#bg)"/>
  <text x="65" y="67" class="h">One concept · four depths · no planted misconceptions</text>
  <text x="65" y="101" class="sub">Choose the entry rung from demonstrated knowledge, then climb without breaking the invariant truth.</text>

  <g filter="url(#s)">
    <path d="M78 655 H320 V520 H554 V385 H788 V250 H1122 V724 H78 Z" fill="url(#step)" stroke="#4f91a9" stroke-width="2"/>
    <g transform="translate(102 548)">
      <text class="k">ELI10 · ENTER</text><text y="35" class="t">Concrete causal model</text>
      <text y="66" class="b">one mechanism · familiar objects</text><text y="90" class="b">act, predict, compare · little notation</text>
    </g>
    <g transform="translate(338 414)">
      <text class="k">ELI15 · CONNECT</text><text y="35" class="t">Multiple representations</text>
      <text y="66" class="b">diagram ↔ words ↔ simple symbols</text><text y="90" class="b">conditions, proportionality, contrast</text>
    </g>
    <g transform="translate(572 278)">
      <text class="k">ELI20 · FORMALIZE</text><text y="35" class="t">Model and derivation</text>
      <text y="66" class="b">equations · assumptions · boundaries</text><text y="90" class="b">worked proof + counterexample</text>
    </g>
    <g transform="translate(806 145)">
      <text class="k">ELI25 · EXTEND</text><text y="35" class="t">Expert frontier</text>
      <text y="66" class="b">competing models · edge cases · proofs</text><text y="90" class="b">open questions · research transfer</text>
    </g>
  </g>

  <path d="M170 680 C330 625 416 508 542 478 S746 336 862 305 S1010 210 1081 180" fill="none" stroke="#ffc857" stroke-width="7" marker-end="url(#a)"/>
  <circle cx="170" cy="680" r="10" fill="#ffc857"/><circle cx="446" cy="518" r="10" fill="#ffc857"/><circle cx="688" cy="379" r="10" fill="#ffc857"/><circle cx="924" cy="269" r="10" fill="#ffc857"/>
  <rect x="373" y="706" width="454" height="54" rx="17" fill="#fffdf7"/>
  <text x="405" y="739" class="g">FIDELITY THREAD · truths preserved at every rung</text>

  <rect x="78" y="780" width="1044" height="42" rx="14" fill="#0b223d" stroke="#335774"/>
  <text x="102" y="807" class="b">DROP detail explicitly · MARK approximations · NEVER falsify mechanism · TEST transfer before moving on</text>
</svg>
