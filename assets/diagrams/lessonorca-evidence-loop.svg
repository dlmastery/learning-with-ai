<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">LessonOrca product-to-evidence loop</title>
  <desc id="desc">Human tutor workflow, learner support, and family visibility emit privacy-separated structured events. Aggregate outcomes test teaching policies. Human reviewers inspect artifacts and results. Verified findings improve the next product release, with delayed independent transfer as the north-star outcome.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <linearGradient id="north" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#172554" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="tealArrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F766E"/>
    </marker>
    <style>
      .title { font-family: Inter, Arial, sans-serif; fill: #172554; font-weight: 800; }
      .node { font-family: Inter, Arial, sans-serif; fill: #172554; font-size: 23px; font-weight: 750; }
      .copy { font-family: Inter, Arial, sans-serif; fill: #334155; font-size: 18px; }
      .small { font-family: Inter, Arial, sans-serif; fill: #475569; font-size: 16px; }
      .white { font-family: Inter, Arial, sans-serif; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1400" height="930" rx="30" fill="url(#bg)"/>
  <text x="700" y="54" text-anchor="middle" class="title" font-size="34">FROM PRODUCT USE TO LEARNING EVIDENCE</text>
  <text x="700" y="87" text-anchor="middle" class="copy">Instrument the whole teaching chain · keep raw child content out of analytics</text>

  <rect x="122" y="124" width="340" height="150" rx="24" fill="#FFFFFF" stroke="#93C5FD" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="172" cy="172" r="27" fill="#DBEAFE"/>
  <path d="M160 174 q12-18 24 0 M155 196 q17-16 34 0" fill="none" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>
  <text x="218" y="175" class="node">HUMAN TUTOR</text>
  <text x="154" y="218" class="copy">context · plan · live judgment</text>
  <text x="154" y="247" class="copy">accept · edit · reject</text>

  <rect x="530" y="124" width="340" height="150" rx="24" fill="#FFFFFF" stroke="#5EEAD4" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="580" cy="172" r="27" fill="#CCFBF1"/>
  <path d="M567 174 q13-19 26 0 M561 197 q19-17 38 0" fill="none" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/>
  <text x="626" y="175" class="node">LEARNER</text>
  <text x="562" y="218" class="copy">attempt · explain · retrieve</text>
  <text x="562" y="247" class="copy">transfer without support</text>

  <rect x="938" y="124" width="340" height="150" rx="24" fill="#FFFFFF" stroke="#FCD34D" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="988" cy="172" r="27" fill="#FEF3C7"/>
  <path d="M975 174 q13-19 26 0 M969 197 q19-17 38 0" fill="none" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
  <text x="1034" y="175" class="node">FAMILY / CENTER</text>
  <text x="970" y="218" class="copy">review · correct · authorize</text>
  <text x="970" y="247" class="copy">policy · export · delete</text>

  <path d="M292 278 C320 334 411 348 486 365" fill="none" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M700 278 L700 355" fill="none" stroke="#0F766E" stroke-width="5" marker-end="url(#tealArrow)"/>
  <path d="M1108 278 C1080 334 989 348 914 365" fill="none" stroke="#D97706" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="290" y="364" width="820" height="174" rx="28" fill="#172554" filter="url(#shadow)"/>
  <text x="700" y="408" text-anchor="middle" class="white" font-size="25" font-weight="800">PRIVACY-SEPARATED EVENT CONTRACT</text>
  <text x="700" y="443" text-anchor="middle" class="white" font-size="18">rotating ID · concept · support mode · attempt · human override · delayed probe</text>

  <rect x="340" y="470" width="320" height="42" rx="21" fill="#DBEAFE"/>
  <text x="500" y="497" text-anchor="middle" class="small" font-weight="750">STRUCTURE ONLY</text>
  <rect x="740" y="470" width="320" height="42" rx="21" fill="#FEE2E2"/>
  <text x="900" y="497" text-anchor="middle" class="small" font-weight="750">NO RAW CHAT · AUDIO · IDENTITY</text>

  <path d="M700 542 L700 590" stroke="#2563EB" stroke-width="6" marker-end="url(#arrow)"/>

  <rect x="90" y="603" width="360" height="152" rx="24" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="3" filter="url(#shadow)"/>
  <text x="270" y="646" text-anchor="middle" class="node">1 · MEASURE</text>
  <text x="270" y="680" text-anchor="middle" class="copy">baseline · mastery · transfer</text>
  <text x="270" y="709" text-anchor="middle" class="copy">tutor time · artifact correction</text>
  <text x="270" y="738" text-anchor="middle" class="small">engagement explains reach</text>

  <rect x="520" y="603" width="360" height="152" rx="24" fill="#FFFFFF" stroke="#93C5FD" stroke-width="3" filter="url(#shadow)"/>
  <text x="700" y="646" text-anchor="middle" class="node">2 · TEST POLICY</text>
  <text x="700" y="680" text-anchor="middle" class="copy">Socratic-first</text>
  <text x="700" y="709" text-anchor="middle" class="copy">vs adaptive teaching router</text>
  <text x="700" y="738" text-anchor="middle" class="small">same goal · verified content · no-AI probe</text>

  <rect x="950" y="603" width="360" height="152" rx="24" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="3" filter="url(#shadow)"/>
  <text x="1130" y="646" text-anchor="middle" class="node">3 · HUMAN REVIEW</text>
  <text x="1130" y="680" text-anchor="middle" class="copy">inspect errors and disparities</text>
  <text x="1130" y="709" text-anchor="middle" class="copy">publish denominator + uncertainty</text>
  <text x="1130" y="738" text-anchor="middle" class="small">no claim outruns its design</text>

  <path d="M454 680 L514 680" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M884 680 L944 680" stroke="#2563EB" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="315" y="810" width="770" height="82" rx="25" fill="url(#north)" filter="url(#shadow)"/>
  <text x="700" y="843" text-anchor="middle" class="white" font-size="22" font-weight="800">NORTH STAR: DELAYED INDEPENDENT TRANSFER</text>
  <text x="700" y="874" text-anchor="middle" class="white" font-size="18">new problem · 7+ days later · changed context · no tutor or AI assistance</text>

  <path d="M1130 759 C1130 830 1135 901 1070 906 C870 921 330 915 205 860 C126 825 122 575 265 500" fill="none" stroke="#0F766E" stroke-width="5" stroke-dasharray="13 10" marker-end="url(#tealArrow)"/>
  <text x="146" y="610" class="small" transform="rotate(-82 146 610)">verified findings improve the next release</text>
</svg>
