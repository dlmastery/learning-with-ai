<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">Human escalation architecture for a child AI mentor</title>
  <desc id="desc">The learner enters a rights-preserving safety router. Ordinary and advanced learning remains open. Consequential capabilities are permission-gated. Learner-selected support stays private. Credible urgent signals go to a trained local reviewer before minimum-necessary escalation. An audit, appeal, and deletion layer surrounds the system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#172554" flood-opacity=".12"/>
    </filter>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
    <marker id="tealArrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F766E"/>
    </marker>
    <marker id="amberArrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#D97706"/>
    </marker>
    <style>
      .title { font-family: Inter, Arial, sans-serif; fill: #172554; font-weight: 800; }
      .copy { font-family: Inter, Arial, sans-serif; fill: #334155; font-size: 18px; }
      .small { font-family: Inter, Arial, sans-serif; fill: #475569; font-size: 17px; }
      .node { font-family: Inter, Arial, sans-serif; fill: #172554; font-size: 24px; font-weight: 750; }
      .white { font-family: Inter, Arial, sans-serif; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1400" height="930" rx="30" fill="url(#bg)"/>
  <text x="700" y="55" text-anchor="middle" class="title" font-size="34">SAFE ENOUGH TO BE FREE</text>
  <text x="700" y="88" text-anchor="middle" class="copy">Gate external consequence · keep knowledge open · escalate through accountable people</text>

  <rect x="85" y="142" width="250" height="112" rx="56" fill="#172554" filter="url(#shadow)"/>
  <text x="210" y="187" text-anchor="middle" class="white" font-size="25" font-weight="800">LEARNER</text>
  <text x="210" y="218" text-anchor="middle" class="white" font-size="18">question · creation · action</text>

  <path d="M339 198 L480 198" stroke="#2563EB" stroke-width="6" marker-end="url(#blueArrow)"/>

  <rect x="490" y="122" width="420" height="152" rx="26" fill="#FFFFFF" stroke="#93C5FD" stroke-width="3" filter="url(#shadow)"/>
  <text x="700" y="168" text-anchor="middle" class="node">RIGHTS-PRESERVING ROUTER</text>
  <text x="700" y="203" text-anchor="middle" class="copy">Classify the requested action and immediate context</text>
  <text x="700" y="232" text-anchor="middle" class="copy">not the child’s character, emotion, or identity</text>

  <rect x="1048" y="142" width="267" height="112" rx="22" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="3"/>
  <text x="1182" y="184" text-anchor="middle" class="node" fill="#065F46">AGE-BAND TOKEN</text>
  <text x="1182" y="214" text-anchor="middle" class="small">separate service · raw proof deleted</text>
  <path d="M1044 198 L916 198" stroke="#0F766E" stroke-width="5" stroke-dasharray="11 9" marker-end="url(#tealArrow)"/>

  <path d="M700 277 L700 319" stroke="#2563EB" stroke-width="6" marker-end="url(#blueArrow)"/>

  <rect x="80" y="350" width="290" height="180" rx="24" fill="#EFF6FF" stroke="#60A5FA" stroke-width="3" filter="url(#shadow)"/>
  <text x="225" y="394" text-anchor="middle" class="node">LEARN</text>
  <text x="225" y="426" text-anchor="middle" class="copy">Ordinary + advanced ideas</text>
  <text x="225" y="458" text-anchor="middle" class="copy">teach accurately</text>
  <rect x="122" y="482" width="206" height="32" rx="16" fill="#DBEAFE"/>
  <text x="225" y="504" text-anchor="middle" class="small" font-weight="700">knowledge stays open</text>

  <rect x="405" y="350" width="290" height="180" rx="24" fill="#FFF7ED" stroke="#FDBA74" stroke-width="3" filter="url(#shadow)"/>
  <text x="550" y="394" text-anchor="middle" class="node">GATE ACTION</text>
  <text x="550" y="426" text-anchor="middle" class="copy">share · spend · post</text>
  <text x="550" y="458" text-anchor="middle" class="copy">tools · code · physical act</text>
  <rect x="447" y="482" width="206" height="32" rx="16" fill="#FFEDD5"/>
  <text x="550" y="504" text-anchor="middle" class="small" font-weight="700">preview + permission</text>

  <rect x="730" y="350" width="290" height="180" rx="24" fill="#F0FDFA" stroke="#5EEAD4" stroke-width="3" filter="url(#shadow)"/>
  <text x="875" y="394" text-anchor="middle" class="node">OFFER SUPPORT</text>
  <text x="875" y="426" text-anchor="middle" class="copy">frustration · conflict · worry</text>
  <text x="875" y="458" text-anchor="middle" class="copy">learner chooses next person</text>
  <rect x="772" y="482" width="206" height="32" rx="16" fill="#CCFBF1"/>
  <text x="875" y="504" text-anchor="middle" class="small" font-weight="700">private by default</text>

  <rect x="1055" y="350" width="290" height="180" rx="24" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="3" filter="url(#shadow)"/>
  <text x="1200" y="394" text-anchor="middle" class="node">REVIEW SIGNAL</text>
  <text x="1200" y="426" text-anchor="middle" class="copy">credible exploitation, abuse</text>
  <text x="1200" y="458" text-anchor="middle" class="copy">or acute imminent harm</text>
  <rect x="1097" y="482" width="206" height="32" rx="16" fill="#FEE2E2"/>
  <text x="1200" y="504" text-anchor="middle" class="small" font-weight="700">automation triggers review</text>

  <path d="M588 316 C500 321 333 323 229 345" fill="none" stroke="#2563EB" stroke-width="5" marker-end="url(#blueArrow)"/>
  <path d="M651 316 C625 326 592 333 562 345" fill="none" stroke="#D97706" stroke-width="5" marker-end="url(#amberArrow)"/>
  <path d="M749 316 C777 326 816 333 860 345" fill="none" stroke="#0F766E" stroke-width="5" marker-end="url(#tealArrow)"/>
  <path d="M812 316 C910 321 1080 326 1185 345" fill="none" stroke="#DC2626" stroke-width="5" marker-end="url(#amberArrow)"/>

  <rect x="965" y="612" width="380" height="124" rx="24" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3" filter="url(#shadow)"/>
  <text x="1155" y="657" text-anchor="middle" class="node">TRAINED LOCAL REVIEWER</text>
  <text x="1155" y="690" text-anchor="middle" class="copy">exact evidence · local policy · minimum context</text>
  <text x="1155" y="719" text-anchor="middle" class="small">named role, language coverage, tested handoff</text>
  <path d="M1200 533 L1164 607" stroke="#D97706" stroke-width="6" marker-end="url(#amberArrow)"/>

  <rect x="965" y="778" width="380" height="102" rx="24" fill="#172554" filter="url(#shadow)"/>
  <text x="1155" y="820" text-anchor="middle" class="white" font-size="23" font-weight="800">AUTHORIZED HUMAN ACTION</text>
  <text x="1155" y="851" text-anchor="middle" class="white" font-size="18">only when threshold + law + policy require it</text>
  <path d="M1155 740 L1155 772" stroke="#D97706" stroke-width="6" marker-end="url(#amberArrow)"/>

  <rect x="80" y="612" width="780" height="268" rx="28" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="3"/>
  <text x="470" y="658" text-anchor="middle" class="node">THE SAFETY ENVELOPE</text>

  <g>
    <rect x="118" y="694" width="210" height="60" rx="18" fill="#EDE9FE"/>
    <text x="223" y="720" text-anchor="middle" class="title" font-size="18">NO ADS OR UPSELLS</text>
    <text x="223" y="743" text-anchor="middle" class="small">learning is the objective</text>

    <rect x="365" y="694" width="210" height="60" rx="18" fill="#DBEAFE"/>
    <text x="470" y="720" text-anchor="middle" class="title" font-size="18">VISIBLE MEMORY</text>
    <text x="470" y="743" text-anchor="middle" class="small">correct · export · delete</text>

    <rect x="612" y="694" width="210" height="60" rx="18" fill="#CCFBF1"/>
    <text x="717" y="720" text-anchor="middle" class="title" font-size="18">NO DEPENDENCY</text>
    <text x="717" y="743" text-anchor="middle" class="small">independence is success</text>

    <rect x="118" y="785" width="210" height="60" rx="18" fill="#FEF3C7"/>
    <text x="223" y="811" text-anchor="middle" class="title" font-size="18">MINIMUM DATA</text>
    <text x="223" y="834" text-anchor="middle" class="small">local · narrow · expiring</text>

    <rect x="365" y="785" width="210" height="60" rx="18" fill="#FEE2E2"/>
    <text x="470" y="811" text-anchor="middle" class="title" font-size="18">NO EMOTION SCORE</text>
    <text x="470" y="834" text-anchor="middle" class="small">ask, do not secretly infer</text>

    <rect x="612" y="785" width="210" height="60" rx="18" fill="#D1FAE5"/>
    <text x="717" y="811" text-anchor="middle" class="title" font-size="18">AUDIT + APPEAL</text>
    <text x="717" y="834" text-anchor="middle" class="small">every restriction reviewable</text>
  </g>

  <text x="700" y="914" text-anchor="middle" class="title" font-size="21">Success = protected dignity + continued learning + stronger real-world connection</text>
</svg>
