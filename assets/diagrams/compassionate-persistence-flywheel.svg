<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Compassionate persistence flywheel for an AI mentor</title>
  <desc id="desc">A learner-owned purpose leads to a small meaningful action, calibrated challenge, visible capability growth, and connection to people and projects. Friction is detected and repaired, while every return is welcomed without shame. The outcome metric is independent capability, not time in the app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07152f"/><stop offset="1" stop-color="#173f5e"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020914" flood-opacity=".5"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77dfcb"/></marker>
    <style>
      .h{font:700 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}.sub{font:400 17px Inter,Segoe UI,sans-serif;fill:#bed0e3}
      .k{font:700 12px Inter,Segoe UI,sans-serif;letter-spacing:1.1px;fill:#83ead6}.t{font:700 19px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .b{font:400 14px Inter,Segoe UI,sans-serif;fill:#d9e6f1}.dark{font:700 20px Inter,Segoe UI,sans-serif;fill:#102840}.ds{font:400 14px Inter,Segoe UI,sans-serif;fill:#36546e}
    </style>
  </defs>
  <rect width="1200" height="850" rx="34" fill="url(#bg)"/>
  <text x="65" y="68" class="h">Persistence grows from agency, progress, and belonging</text>
  <text x="65" y="102" class="sub">The mentor removes friction and restores momentum. It never optimizes compulsion or punishes a return.</text>

  <g filter="url(#s)">
    <rect x="90" y="190" width="245" height="140" rx="24" fill="#173e66" stroke="#5288b4"/>
    <text x="115" y="225" class="k">01 · PURPOSE</text><text x="115" y="262" class="t">Learner-owned reason</text><text x="115" y="292" class="b">goal · identity · community use</text>
    <rect x="475" y="145" width="250" height="140" rx="24" fill="#164457" stroke="#55a99d"/>
    <text x="500" y="180" class="k">02 · ACTION</text><text x="500" y="217" class="t">Small meaningful move</text><text x="500" y="247" class="b">build · solve · explain · practice</text>
    <rect x="865" y="190" width="245" height="140" rx="24" fill="#164457" stroke="#55a99d"/>
    <text x="890" y="225" class="k">03 · CHALLENGE</text><text x="890" y="262" class="t">Just enough stretch</text><text x="890" y="292" class="b">choice · hint · feedback · retry</text>
    <rect x="865" y="520" width="245" height="140" rx="24" fill="#3b2d46" stroke="#c38fd1"/>
    <text x="890" y="555" class="k" fill="#e8b7f4">04 · PROGRESS</text><text x="890" y="592" class="t">Capability made visible</text><text x="890" y="622" class="b">evidence · mastery · contribution</text>
    <rect x="475" y="565" width="250" height="140" rx="24" fill="#3b2d46" stroke="#c38fd1"/>
    <text x="500" y="600" class="k" fill="#e8b7f4">05 · BELONGING</text><text x="500" y="637" class="t">People and shared work</text><text x="500" y="667" class="b">teacher · peer · family · mentor</text>
    <rect x="90" y="520" width="245" height="140" rx="24" fill="#4b3d22" stroke="#dda94c"/>
    <text x="115" y="555" class="k" fill="#ffd47c">06 · RETURN</text><text x="115" y="592" class="t">Welcome, never shame</text><text x="115" y="622" class="b">resume · reschedule · choose again</text>
  </g>
  <path d="M335 240 C385 205 415 198 466 205" fill="none" stroke="#77dfcb" stroke-width="4" marker-end="url(#a)"/>
  <path d="M725 205 C780 198 814 210 856 240" fill="none" stroke="#77dfcb" stroke-width="4" marker-end="url(#a)"/>
  <path d="M1015 330 C1054 392 1054 460 1015 511" fill="none" stroke="#77dfcb" stroke-width="4" marker-end="url(#a)"/>
  <path d="M865 609 C815 647 780 656 734 646" fill="none" stroke="#77dfcb" stroke-width="4" marker-end="url(#a)"/>
  <path d="M475 646 C418 656 382 642 344 609" fill="none" stroke="#77dfcb" stroke-width="4" marker-end="url(#a)"/>
  <path d="M168 520 C126 458 126 398 168 339" fill="none" stroke="#77dfcb" stroke-width="4" marker-end="url(#a)"/>

  <g filter="url(#s)">
    <circle cx="600" cy="425" r="112" fill="#fffdf7" stroke="#ffc857" stroke-width="4"/>
    <text x="528" y="397" class="k" fill="#157268">SUCCESS METRIC</text>
    <text x="515" y="434" class="dark">Independent</text><text x="523" y="461" class="dark">capability</text>
    <text x="523" y="492" class="ds">not time in app</text>
  </g>
  <rect x="90" y="760" width="1020" height="50" rx="16" fill="#0b223d" stroke="#335774"/>
  <text x="118" y="791" class="b">Detect friction → ask, do not infer → offer the smallest repair → preserve learner choice → escalate to a trusted person when wanted</text>
</svg>
