<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Universal mentor reference architecture</title>
  <desc id="desc">A learner enters through an inclusive multimodal interface. A mentor conductor selects an explicit teaching action and coordinates a role-certified expert mesh, verified knowledge compiler, learner-owned state, human network and action surfaces, and evidence engine. Shared contracts make every component replaceable. The system runs across learner-device, community-hub, and regional-cloud tiers, while a local core continues through an outage.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172554" flood-opacity=".12"/>
    </filter>
    <linearGradient id="header" x1="0" x2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" x2="1">
      <stop offset="0" stop-color="#DBEAFE"/>
      <stop offset="1" stop-color="#CCFBF1"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0F766E"/>
    </marker>
    <style>
      .title{font:700 35px Inter,Arial,sans-serif;fill:#172554}
      .sub{font:400 18px Inter,Arial,sans-serif;fill:#475569}
      .eyebrow{font:700 13px Inter,Arial,sans-serif;fill:#2563EB;letter-spacing:1.4px}
      .boxhead{font:700 20px Inter,Arial,sans-serif;fill:#172554}
      .body{font:400 15px Inter,Arial,sans-serif;fill:#334155}
      .small{font:500 13px Inter,Arial,sans-serif;fill:#475569}
      .whitehead{font:700 21px Inter,Arial,sans-serif;fill:#fff}
      .whitebody{font:400 14px Inter,Arial,sans-serif;fill:#E0F2FE}
      .contract{font:700 13px Inter,Arial,sans-serif;fill:#172554}
      .tierhead{font:700 17px Inter,Arial,sans-serif;fill:#172554}
      .tierbody{font:400 13px Inter,Arial,sans-serif;fill:#334155}
      .step{font:700 14px Inter,Arial,sans-serif;fill:#172554}
    </style>
  </defs>

  <rect width="1600" height="1080" fill="#FFFDF7"/>
  <circle cx="1475" cy="92" r="170" fill="#DBEAFE" opacity=".55"/>
  <circle cx="110" cy="970" r="170" fill="#CCFBF1" opacity=".55"/>

  <text x="70" y="62" class="title">THE UNIVERSAL MENTOR IS A PROTOCOL, NOT ONE GIANT MODEL</text>
  <text x="70" y="95" class="sub">One coherent learner relationship · replaceable intelligence · verified knowledge · trusted humans · local continuity</text>

  <!-- learner and inclusive interface -->
  <g filter="url(#shadow)">
    <rect x="70" y="145" width="250" height="260" rx="28" fill="#172554"/>
  </g>
  <circle cx="195" cy="215" r="37" fill="#FDE68A"/>
  <path d="M132 322 C142 261 248 261 258 322" fill="#38BDF8"/>
  <rect x="121" y="314" width="148" height="32" rx="16" fill="#0F766E"/>
  <text x="195" y="373" text-anchor="middle" class="whitehead">LEARNER</text>
  <text x="195" y="394" text-anchor="middle" class="whitebody">owns state, evidence, and exit</text>

  <g filter="url(#shadow)">
    <rect x="70" y="420" width="250" height="166" rx="22" fill="#E0F2FE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="92" y="453" class="eyebrow">PLANE 1</text>
  <text x="92" y="483" class="boxhead">Inclusive interface</text>
  <text x="92" y="511" class="body">voice · text · AAC · vision</text>
  <text x="92" y="535" class="body">screen · page · object · action</text>
  <text x="92" y="559" class="small">language, depth, modality, pace</text>

  <path d="M195 405 L195 418" stroke="#2563EB" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <path d="M322 503 L402 503" stroke="#2563EB" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <!-- conductor -->
  <g filter="url(#shadow)">
    <rect x="405" y="205" width="380" height="380" rx="30" fill="url(#header)"/>
  </g>
  <text x="440" y="246" class="eyebrow" style="fill:#BAE6FD">PLANE 2 · CONTROL</text>
  <text x="440" y="283" class="whitehead" style="font-size:27px">MENTOR CONDUCTOR</text>
  <text x="440" y="312" class="whitebody">keeps one relationship coherent</text>

  <rect x="442" y="340" width="306" height="57" rx="16" fill="#FFF" opacity=".96"/>
  <text x="461" y="366" class="step">1 · READ permitted state + current goal</text>
  <text x="461" y="386" class="small">make uncertainty visible</text>
  <rect x="442" y="409" width="306" height="57" rx="16" fill="#FFF" opacity=".96"/>
  <text x="461" y="435" class="step">2 · CHOOSE a teaching action</text>
  <text x="461" y="455" class="small">teach · hint · retrieve · build · connect</text>
  <rect x="442" y="478" width="306" height="57" rx="16" fill="#FFF" opacity=".96"/>
  <text x="461" y="504" class="step">3 · ROUTE by evidence + constraints</text>
  <text x="461" y="524" class="small">role fitness · privacy · latency · cost</text>
  <text x="595" y="562" text-anchor="middle" class="whitebody">explain why this action was selected</text>

  <!-- expert/support planes -->
  <path d="M786 285 C835 285 824 214 858 214" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M786 365 L858 365" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M786 445 L858 445" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M786 525 C835 525 824 596 858 596" fill="none" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <g filter="url(#shadow)">
    <rect x="860" y="145" width="300" height="138" rx="22" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="1190" y="145" width="340" height="138" rx="22" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
    <rect x="860" y="306" width="300" height="138" rx="22" fill="#FFF7ED" stroke="#D97706" stroke-width="2"/>
    <rect x="1190" y="306" width="340" height="138" rx="22" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
    <rect x="860" y="467" width="300" height="138" rx="22" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="1190" y="467" width="340" height="138" rx="22" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
  </g>

  <text x="884" y="174" class="eyebrow" style="fill:#7C3AED">PLANE 3</text>
  <text x="884" y="204" class="boxhead">Expert mentor mesh</text>
  <text x="884" y="231" class="body">domain · pedagogy · culture</text>
  <text x="884" y="255" class="small">certified per role; agreement checked</text>

  <text x="1214" y="174" class="eyebrow" style="fill:#0F766E">PLANE 4</text>
  <text x="1214" y="204" class="boxhead">Verified knowledge compiler</text>
  <text x="1214" y="231" class="body">sources → ConceptSpec → learning object</text>
  <text x="1214" y="255" class="small">truth · render · access · provenance checks</text>

  <text x="884" y="335" class="eyebrow" style="fill:#D97706">PLANE 5</text>
  <text x="884" y="365" class="boxhead">Learner-owned state</text>
  <text x="884" y="392" class="body">goals · evidence · uncertainty · consent</text>
  <text x="884" y="416" class="small">portable, correctable, expiring, local-first</text>

  <text x="1214" y="335" class="eyebrow">PLANE 6</text>
  <text x="1214" y="365" class="boxhead">Actions + human network</text>
  <text x="1214" y="392" class="body">tools · teachers · family · peers · experts</text>
  <text x="1214" y="416" class="small">humans are first-class nodes, not cleanup</text>

  <text x="884" y="496" class="eyebrow" style="fill:#D97706">PLANE 7</text>
  <text x="884" y="526" class="boxhead">Evidence + credentials</text>
  <text x="884" y="553" class="body">product · process · capability · learning</text>
  <text x="884" y="577" class="small">delayed transfer is the north-star claim</text>

  <text x="1214" y="496" class="eyebrow" style="fill:#0F766E">BOUNDARY</text>
  <text x="1214" y="526" class="boxhead">Freedom + consequence</text>
  <text x="1214" y="553" class="body">learning remains broad and exploratory</text>
  <text x="1214" y="577" class="small">high-impact action is permission-gated</text>

  <!-- return path -->
  <path d="M860 536 C818 536 821 614 762 614 L370 614 C327 614 344 503 322 503" fill="none" stroke="#0F766E" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowTeal)"/>
  <text x="575" y="638" text-anchor="middle" class="small" style="fill:#0F766E;font-weight:700">observable learner action → evidence → state update → next teaching action</text>

  <!-- shared contracts -->
  <rect x="70" y="680" width="1460" height="105" rx="24" fill="url(#loop)" stroke="#0F766E" stroke-width="2"/>
  <text x="96" y="711" class="eyebrow" style="fill:#0F766E">SHARED CONTRACTS · THE REPLACEABILITY LAYER</text>
  <g>
    <rect x="96" y="728" width="164" height="36" rx="18" fill="#FFF"/><text x="178" y="751" text-anchor="middle" class="contract">ConceptSpec</text>
    <rect x="275" y="728" width="164" height="36" rx="18" fill="#FFF"/><text x="357" y="751" text-anchor="middle" class="contract">LearnerState</text>
    <rect x="454" y="728" width="164" height="36" rx="18" fill="#FFF"/><text x="536" y="751" text-anchor="middle" class="contract">TeachingAction</text>
    <rect x="633" y="728" width="164" height="36" rx="18" fill="#FFF"/><text x="715" y="751" text-anchor="middle" class="contract">LearningEvidence</text>
    <rect x="812" y="728" width="164" height="36" rx="18" fill="#FFF"/><text x="894" y="751" text-anchor="middle" class="contract">MentorTool</text>
    <rect x="991" y="728" width="164" height="36" rx="18" fill="#FFF"/><text x="1073" y="751" text-anchor="middle" class="contract">SyncEnvelope</text>
    <rect x="1170" y="728" width="164" height="36" rx="18" fill="#FFF"/><text x="1252" y="751" text-anchor="middle" class="contract">HumanHandoff</text>
    <rect x="1349" y="728" width="155" height="36" rx="18" fill="#172554"/><text x="1427" y="751" text-anchor="middle" class="contract" style="fill:#fff">open protocol</text>
  </g>

  <!-- deployment tiers -->
  <text x="70" y="830" class="eyebrow">PHYSICAL DEPLOYMENT · CAPABILITY DEGRADES GRACEFULLY, THE RELATIONSHIP CONTINUES</text>
  <g filter="url(#shadow)">
    <rect x="70" y="854" width="455" height="142" rx="24" fill="#ECFDF5" stroke="#0F766E" stroke-width="2"/>
    <rect x="572" y="854" width="455" height="142" rx="24" fill="#E0F2FE" stroke="#2563EB" stroke-width="2"/>
    <rect x="1074" y="854" width="456" height="142" rx="24" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <circle cx="105" cy="891" r="20" fill="#0F766E"/><text x="105" y="897" text-anchor="middle" class="contract" style="fill:#fff">1</text>
  <text x="139" y="891" class="tierhead">LEARNER DEVICE · ALWAYS USEFUL</text>
  <text x="95" y="923" class="tierbody">encrypted state · cached ConceptSpecs · local practice</text>
  <text x="95" y="947" class="tierbody">basic speech/text · evidence queue · offline lesson continuity</text>
  <text x="95" y="973" class="small" style="fill:#0F766E;font-weight:700">outage mode: continue, label limits, sync later</text>

  <circle cx="607" cy="891" r="20" fill="#2563EB"/><text x="607" y="897" text-anchor="middle" class="contract" style="fill:#fff">2</text>
  <text x="641" y="891" class="tierhead">SCHOOL / COMMUNITY HUB</text>
  <text x="597" y="923" class="tierbody">shared model cache · local curriculum · teacher workspace</text>
  <text x="597" y="947" class="tierbody">peer groups · deferred sync · repair and update point</text>
  <text x="597" y="973" class="small" style="fill:#2563EB;font-weight:700">bandwidth multiplier + trusted human coordination</text>

  <circle cx="1109" cy="891" r="20" fill="#7C3AED"/><text x="1109" y="897" text-anchor="middle" class="contract" style="fill:#fff">3</text>
  <text x="1143" y="891" class="tierhead">REGIONAL / CLOUD SPECIALISTS</text>
  <text x="1099" y="923" class="tierbody">frontier reasoning · heavy generation · rare expertise</text>
  <text x="1099" y="947" class="tierbody">model updates · credential checks · authorized escalation</text>
  <text x="1099" y="973" class="small" style="fill:#7C3AED;font-weight:700">optional acceleration, never sole point of continuity</text>

  <path d="M525 925 L568 925" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M1027 925 L1070 925" stroke="#2563EB" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M1070 959 L1032 959" stroke="#0F766E" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrowTeal)"/>
  <path d="M568 959 L530 959" stroke="#0F766E" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrowTeal)"/>

  <rect x="70" y="1022" width="1460" height="34" rx="17" fill="#172554"/>
  <text x="800" y="1045" text-anchor="middle" class="whitebody" style="font-weight:700">ACCEPTANCE: a model or vendor can be replaced without losing the learner, and learning continues through an outage.</text>
</svg>
