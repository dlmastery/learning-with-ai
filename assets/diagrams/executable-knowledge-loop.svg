<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Executable knowledge loop</title>
  <desc id="desc">A grounded concept specification is compiled into coordinated text, diagram, code, simulation, proof, and practice representations. Sandboxed tools verify declared invariants. The learner changes inputs, predicts, runs, explains, and transfers. Their evidence returns to the learner-owned state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#EDF6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172554" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <style>
      .h1{font:800 34px Inter,Arial,sans-serif;fill:#172554}
      .h2{font:800 20px Inter,Arial,sans-serif;fill:#172554}
      .body{font:500 15px Inter,Arial,sans-serif;fill:#334155}
      .small{font:600 13px Inter,Arial,sans-serif;fill:#475569}
      .pill{font:750 14px Inter,Arial,sans-serif;fill:#17324A}
      .link{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="30" fill="url(#bg)"/>
  <text x="60" y="62" class="h1">An explanation becomes a manipulable, testable object</text>
  <text x="60" y="94" class="body">Generate many representations from one grounded specification; verify declared claims; return learner actions as evidence.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="150" width="250" height="190" rx="26" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="180" y="190" text-anchor="middle" class="h2">CONCEPT SPEC</text>
    <text x="180" y="220" text-anchor="middle" class="body">goal + prerequisites</text>
    <text x="180" y="247" text-anchor="middle" class="body">sources + definitions</text>
    <text x="180" y="274" text-anchor="middle" class="body">invariants + assumptions</text>
    <text x="180" y="301" text-anchor="middle" class="body">access + language</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="390" y="128" width="420" height="235" rx="26" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <text x="600" y="168" text-anchor="middle" class="h2">REPRESENTATION COMPILER</text>
    <text x="600" y="193" text-anchor="middle" class="small">one meaning • coordinated views • visible lineage</text>
    <rect x="425" y="222" width="105" height="48" rx="15" fill="#CCFBF1"/>
    <text x="477" y="252" text-anchor="middle" class="pill">TEXT</text>
    <rect x="547" y="222" width="105" height="48" rx="15" fill="#CCFBF1"/>
    <text x="599" y="252" text-anchor="middle" class="pill">DIAGRAM</text>
    <rect x="669" y="222" width="105" height="48" rx="15" fill="#CCFBF1"/>
    <text x="721" y="252" text-anchor="middle" class="pill">CODE</text>
    <rect x="425" y="286" width="105" height="48" rx="15" fill="#DFF6EF"/>
    <text x="477" y="316" text-anchor="middle" class="pill">SIM</text>
    <rect x="547" y="286" width="105" height="48" rx="15" fill="#DFF6EF"/>
    <text x="599" y="316" text-anchor="middle" class="pill">PROOF</text>
    <rect x="669" y="286" width="105" height="48" rx="15" fill="#DFF6EF"/>
    <text x="721" y="316" text-anchor="middle" class="pill">PRACTICE</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="895" y="150" width="250" height="190" rx="26" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="1020" y="190" text-anchor="middle" class="h2">VERIFICATION</text>
    <text x="1020" y="220" text-anchor="middle" class="body">tests + types + units</text>
    <text x="1020" y="247" text-anchor="middle" class="body">proof kernel + schemas</text>
    <text x="1020" y="274" text-anchor="middle" class="body">source entailment</text>
    <text x="1020" y="301" text-anchor="middle" class="body">simulation validity scope</text>
  </g>

  <path d="M305 245L390 245" class="link"/>
  <path d="M810 245L895 245" class="link"/>

  <g filter="url(#shadow)">
    <rect x="190" y="445" width="820" height="160" rx="30" fill="#172554"/>
    <text x="600" y="488" text-anchor="middle" style="font:800 23px Inter,Arial,sans-serif;fill:#FFFFFF">LEARNER ACTION LOOP</text>
    <rect x="232" y="516" width="118" height="48" rx="15" fill="#DBEAFE"/>
    <text x="291" y="546" text-anchor="middle" class="pill">PREDICT</text>
    <rect x="372" y="516" width="118" height="48" rx="15" fill="#CCFBF1"/>
    <text x="431" y="546" text-anchor="middle" class="pill">CHANGE</text>
    <rect x="512" y="516" width="118" height="48" rx="15" fill="#FEF3C7"/>
    <text x="571" y="546" text-anchor="middle" class="pill">RUN</text>
    <rect x="652" y="516" width="118" height="48" rx="15" fill="#F3E8FF"/>
    <text x="711" y="546" text-anchor="middle" class="pill">EXPLAIN</text>
    <rect x="792" y="516" width="176" height="48" rx="15" fill="#FCE7F3"/>
    <text x="880" y="546" text-anchor="middle" class="pill">TRANSFER</text>
  </g>

  <path d="M1020 340C1020 400 920 410 900 445" class="link"/>
  <path d="M600 445L600 363" class="link"/>

  <g filter="url(#shadow)">
    <rect x="360" y="650" width="480" height="64" rx="20" fill="#FFFFFF" stroke="#A78BFA" stroke-width="2"/>
    <text x="600" y="678" text-anchor="middle" class="h2">LEARNER-OWNED EVIDENCE</text>
    <text x="600" y="701" text-anchor="middle" class="small">predictions • edits • explanations • verification • transfer</text>
  </g>
  <path d="M600 605L600 650" class="link"/>
  <path d="M360 682C90 682 95 340 180 340" class="link"/>
</svg>
