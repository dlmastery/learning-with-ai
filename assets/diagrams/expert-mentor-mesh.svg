<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">The expert AI mentor mesh</title>
  <desc id="desc">A learner talks with one mentor conductor. The conductor reads a learner-owned state ledger and coordinates curriculum, subject, language, visual, practice, peer, accessibility, and safeguarding agents. Teachers and family remain connected to the system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#EFF6FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172554" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <style>
      .h1{font:700 34px system-ui,sans-serif;fill:#172554}
      .h2{font:700 19px system-ui,sans-serif;fill:#172554}
      .body{font:500 15px system-ui,sans-serif;fill:#334155}
      .small{font:500 13px system-ui,sans-serif;fill:#475569}
      .box{fill:#fff;stroke:#CBD5E1;stroke-width:2;rx:20;filter:url(#shadow)}
      .agent{fill:#F8FAFC;stroke:#94A3B8;stroke-width:1.5;rx:16}
      .link{stroke:#64748B;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .soft{stroke:#94A3B8;stroke-width:2;fill:none;stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" class="h1">One coherent mentor. A whole faculty behind it.</text>
  <text x="600" y="88" text-anchor="middle" class="body">Every specialist shares one learner-owned, inspectable state.</text>

  <rect x="55" y="260" width="220" height="160" class="box" stroke="#2563EB"/>
  <circle cx="165" cy="305" r="28" fill="#DBEAFE"/>
  <path d="M151 303a14 14 0 1 1 28 0a14 14 0 1 1-28 0M139 354c7-22 45-22 52 0" fill="none" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/>
  <text x="165" y="382" text-anchor="middle" class="h2">Learner</text>
  <text x="165" y="405" text-anchor="middle" class="small">goals · voice · work · agency</text>

  <rect x="385" y="205" width="430" height="125" class="box" stroke="#0F766E"/>
  <circle cx="448" cy="267" r="30" fill="#CCFBF1"/>
  <path d="M432 267h32M448 251v32" stroke="#0F766E" stroke-width="5" stroke-linecap="round"/>
  <text x="505" y="255" class="h2">Mentor / conductor</text>
  <text x="505" y="281" class="body">One calm learner-facing relationship</text>
  <text x="505" y="306" class="small">routes · synthesizes · explains · stays with the learner</text>

  <rect x="385" y="390" width="430" height="120" class="box" stroke="#D97706"/>
  <text x="600" y="430" text-anchor="middle" class="h2">Learner-owned state ledger</text>
  <text x="600" y="458" text-anchor="middle" class="body">goals · mastery evidence · language · access · successful representations</text>
  <text x="600" y="484" text-anchor="middle" class="small">inspectable · correctable · portable · permissioned</text>

  <path d="M275 340 C325 340 335 267 385 267" class="link"/>
  <path d="M600 330 L600 390" class="link"/>

  <g>
    <rect x="885" y="135" width="255" height="62" class="agent"/>
    <text x="1012" y="163" text-anchor="middle" class="h2">Curriculum architect</text>
    <text x="1012" y="184" text-anchor="middle" class="small">goals → prerequisites → path</text>
    <rect x="885" y="212" width="255" height="62" class="agent"/>
    <text x="1012" y="240" text-anchor="middle" class="h2">Subject specialist</text>
    <text x="1012" y="261" text-anchor="middle" class="small">truth · sources · tools</text>
    <rect x="885" y="289" width="255" height="62" class="agent"/>
    <text x="1012" y="317" text-anchor="middle" class="h2">Language &amp; access</text>
    <text x="1012" y="338" text-anchor="middle" class="small">speech · dialect · modality</text>
    <rect x="885" y="366" width="255" height="62" class="agent"/>
    <text x="1012" y="394" text-anchor="middle" class="h2">Visual teacher</text>
    <text x="1012" y="415" text-anchor="middle" class="small">diagram · simulation · world</text>
    <rect x="885" y="443" width="255" height="62" class="agent"/>
    <text x="1012" y="471" text-anchor="middle" class="h2">Practice &amp; assessment</text>
    <text x="1012" y="492" text-anchor="middle" class="small">exercise · feedback · evidence</text>
    <rect x="885" y="520" width="255" height="62" class="agent"/>
    <text x="1012" y="548" text-anchor="middle" class="h2">Peer panel</text>
    <text x="1012" y="569" text-anchor="middle" class="small">alternatives · debate · compare</text>
    <rect x="885" y="597" width="255" height="62" class="agent"/>
    <text x="1012" y="625" text-anchor="middle" class="h2">Safeguarding liaison</text>
    <text x="1012" y="646" text-anchor="middle" class="small">teacher · family · escalation</text>
  </g>

  <path d="M815 267 C855 267 850 166 885 166" class="soft"/>
  <path d="M815 267 C855 267 850 243 885 243" class="soft"/>
  <path d="M815 267 C855 267 850 320 885 320" class="soft"/>
  <path d="M815 267 C855 267 850 397 885 397" class="soft"/>
  <path d="M815 450 C855 450 850 474 885 474" class="soft"/>
  <path d="M815 450 C855 450 850 551 885 551" class="soft"/>
  <path d="M815 450 C855 450 850 628 885 628" class="soft"/>

  <rect x="70" y="565" width="250" height="94" class="box" stroke="#7C3AED"/>
  <text x="195" y="602" text-anchor="middle" class="h2">Teacher &amp; family</text>
  <text x="195" y="628" text-anchor="middle" class="body">goals · culture · care · judgment</text>
  <path d="M320 610 C350 610 355 470 385 455" class="link"/>
  <text x="600" y="716" text-anchor="middle" class="small">Role-specific agents may use different models, tools, knowledge sources, and physical tiers.</text>
</svg>
