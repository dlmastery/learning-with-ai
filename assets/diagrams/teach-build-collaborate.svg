<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Teach, build, and collaborate learning loop</title>
  <desc id="desc">A learner moves through seven connected actions: choose, create, verify, teach, defend, revise, and transfer. An AI mentor and specialist agents support the loop while evidence returns to a learner-owned state ledger.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101B3D"/>
      <stop offset="1" stop-color="#163B4D"/>
    </linearGradient>
    <linearGradient id="learner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC857"/>
      <stop offset="1" stop-color="#F39C45"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#071020" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#77D9D1"/>
    </marker>
    <style>
      .label { font: 700 24px Inter, Arial, sans-serif; fill: #F7FAFC; }
      .small { font: 500 17px Inter, Arial, sans-serif; fill: #D8E6EC; }
      .step { font: 700 18px Inter, Arial, sans-serif; fill: #12213B; }
      .step-sub { font: 500 14px Inter, Arial, sans-serif; fill: #30445A; }
      .support { font: 650 17px Inter, Arial, sans-serif; fill: #F7FAFC; }
    </style>
  </defs>

  <rect width="1200" height="720" rx="30" fill="url(#bg)"/>
  <text x="64" y="66" class="label">Learning by creating, teaching, and revising</text>
  <text x="64" y="98" class="small">The learner remains the author; AI supplies an audience, alternatives, tools, and expert checks.</text>

  <g filter="url(#shadow)">
    <circle cx="600" cy="350" r="115" fill="url(#learner)"/>
    <text x="600" y="330" text-anchor="middle" style="font:800 31px Inter,Arial,sans-serif;fill:#15213A">LEARNER</text>
    <text x="600" y="363" text-anchor="middle" style="font:650 18px Inter,Arial,sans-serif;fill:#273B51">explains • judges</text>
    <text x="600" y="390" text-anchor="middle" style="font:650 18px Inter,Arial,sans-serif;fill:#273B51">builds • owns</text>
  </g>

  <g fill="none" stroke="#77D9D1" stroke-width="4" marker-end="url(#arrow)" opacity=".95">
    <path d="M 380 185 C 490 125, 710 125, 820 185"/>
    <path d="M 915 225 C 1010 285, 1015 405, 935 470"/>
    <path d="M 850 530 C 750 620, 455 625, 350 535"/>
    <path d="M 265 470 C 180 400, 185 285, 285 225"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="85" y="155" width="250" height="105" rx="22" fill="#F6F0DF"/>
    <text x="210" y="192" text-anchor="middle" class="step">1  CHOOSE + CREATE</text>
    <text x="210" y="220" text-anchor="middle" class="step-sub">claim • model • artifact</text>
    <text x="210" y="243" text-anchor="middle" class="step-sub">story • simulation • proof</text>

    <rect x="865" y="155" width="250" height="105" rx="22" fill="#D7F3EE"/>
    <text x="990" y="192" text-anchor="middle" class="step">2  VERIFY + TEACH</text>
    <text x="990" y="220" text-anchor="middle" class="step-sub">ground claims and explain</text>
    <text x="990" y="243" text-anchor="middle" class="step-sub">to a responsive AI student</text>

    <rect x="865" y="455" width="250" height="105" rx="22" fill="#DDE8FA"/>
    <text x="990" y="492" text-anchor="middle" class="step">3  DEFEND + COMPARE</text>
    <text x="990" y="520" text-anchor="middle" class="step-sub">answer an expert panel</text>
    <text x="990" y="543" text-anchor="middle" class="step-sub">and inspect peer strategies</text>

    <rect x="85" y="455" width="250" height="105" rx="22" fill="#F1DDF3"/>
    <text x="210" y="492" text-anchor="middle" class="step">4  REVISE + TRANSFER</text>
    <text x="210" y="520" text-anchor="middle" class="step-sub">repair the explanation</text>
    <text x="210" y="543" text-anchor="middle" class="step-sub">then solve a fresh case</text>
  </g>

  <g>
    <rect x="400" y="545" width="400" height="104" rx="24" fill="#1F5D67" stroke="#77D9D1" stroke-width="2"/>
    <text x="600" y="580" text-anchor="middle" class="support">LEARNER-OWNED EVIDENCE</text>
    <text x="600" y="609" text-anchor="middle" class="small">choices • explanations • corrections • transfer</text>
    <text x="600" y="633" text-anchor="middle" class="small">updates the mentor’s next action</text>
    <path d="M 600 545 L 600 474" stroke="#77D9D1" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <g>
    <rect x="430" y="130" width="340" height="76" rx="22" fill="#2D5474" stroke="#8FB7E8" stroke-width="2"/>
    <text x="600" y="162" text-anchor="middle" class="support">AI MENTOR + SPECIALISTS</text>
    <text x="600" y="188" text-anchor="middle" class="small">audience • peers • tools • truth checks</text>
    <path d="M 600 206 L 600 227" stroke="#8FB7E8" stroke-width="3" marker-end="url(#arrow)"/>
  </g>

  <text x="600" y="690" text-anchor="middle" style="font:500 15px Inter,Arial,sans-serif;fill:#AEC4CE">
    Mastery evidence comes from what the learner can explain, verify, revise, and transfer—not from artifact polish alone.
  </text>
</svg>
