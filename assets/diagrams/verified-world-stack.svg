<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Verified-world stack for generated learning environments</title>
  <desc id="desc">A generated explorable world provides situated experience, while an executable model governs exact laws, grounded sources and data anchor claims, and real-world observation calibrates the stack. The mentor orchestrates actions and makes the truth mode visible to the learner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07152f"/><stop offset="1" stop-color="#163f5e"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#020914" flood-opacity=".5"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77dfcb"/></marker>
    <style>
      .h{font:700 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}.sub{font:400 17px Inter,Segoe UI,sans-serif;fill:#bed0e3}
      .k{font:700 12px Inter,Segoe UI,sans-serif;letter-spacing:1px;fill:#83ead6}.t{font:700 20px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .b{font:400 14px Inter,Segoe UI,sans-serif;fill:#d9e6f1}.dark{font:700 20px Inter,Segoe UI,sans-serif;fill:#102840}.ds{font:400 14px Inter,Segoe UI,sans-serif;fill:#36546e}
    </style>
  </defs>
  <rect width="1200" height="850" rx="34" fill="url(#bg)"/>
  <text x="65" y="68" class="h">Generated worlds become trustworthy through a layered truth stack</text>
  <text x="65" y="102" class="sub">Use generative environments for possibility and presence; use models, sources, and reality for claims.</text>

  <g filter="url(#s)">
    <rect x="155" y="160" width="890" height="120" rx="26" fill="#3b2d46" stroke="#c38fd1"/>
    <text x="190" y="198" class="k" fill="#e8b7f4">EXPERIENCE LAYER · GENERATED WORLD</text>
    <text x="190" y="236" class="t">Explore · role-play · rehearse · compare perspective · imagine counterfactuals</text>
    <text x="190" y="263" class="b">World model · 3D scene · multi-agent space · local context</text>

    <rect x="215" y="320" width="770" height="110" rx="24" fill="#164457" stroke="#55a99d"/>
    <text x="250" y="357" class="k">LAW LAYER · EXECUTABLE MODEL</text>
    <text x="250" y="394" class="t">Equations · state transitions · constraints · units · invariants</text>
    <rect x="275" y="470" width="650" height="110" rx="24" fill="#173f66" stroke="#5288b4"/>
    <text x="310" y="507" class="k">GROUNDING LAYER · SOURCES + DATA</text>
    <text x="310" y="544" class="t">Primary record · map · dataset · measurement · provenance</text>
    <rect x="335" y="620" width="530" height="110" rx="24" fill="#fffdf7" stroke="#ffc857" stroke-width="3"/>
    <text x="370" y="657" class="k" fill="#157268">REALITY LAYER · OBSERVE + CALIBRATE</text>
    <text x="370" y="694" class="dark">Build · measure · visit · ask a person</text>
  </g>
  <path d="M600 280 V311" stroke="#77dfcb" stroke-width="4" marker-end="url(#a)"/><path d="M600 430 V461" stroke="#77dfcb" stroke-width="4" marker-end="url(#a)"/><path d="M600 580 V611" stroke="#77dfcb" stroke-width="4" marker-end="url(#a)"/>

  <rect x="82" y="745" width="1036" height="62" rx="18" fill="#0b223d" stroke="#345874"/>
  <text x="110" y="771" class="k">MENTOR ORCHESTRATION</text>
  <text x="110" y="796" class="b">Display truth mode · ask for intervention · compare world with model and measurement · return evidence to learner state</text>
</svg>
