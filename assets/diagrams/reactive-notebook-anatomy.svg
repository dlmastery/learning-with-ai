<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Anatomy of an AI-native reactive learning notebook</title>
  <desc id="desc">A semantic dependency graph connects source, definition, parameter, computation, visualization, explanation, test, and practice cells. A learner change reruns only affected cells. Tests and claim records verify outputs, and learner predictions and explanations update learner-owned state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#ECF8F6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#172554" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <style>
      .h1{font:800 34px Inter,Arial,sans-serif;fill:#172554}
      .h2{font:800 19px Inter,Arial,sans-serif;fill:#172554}
      .body{font:500 15px Inter,Arial,sans-serif;fill:#334155}
      .small{font:600 13px Inter,Arial,sans-serif;fill:#475569}
      .link{fill:none;stroke:#64748B;stroke-width:2.5;marker-end:url(#arrow)}
      .dashed{fill:none;stroke:#A78BFA;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="780" rx="30" fill="url(#bg)"/>
  <text x="60" y="62" class="h1">The document is a dependency graph, not a pile of cells</text>
  <text x="60" y="94" class="body">Change one assumption; every affected equation, plot, explanation, test, and practice object updates together.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="145" width="245" height="520" rx="26" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="177" y="184" text-anchor="middle" class="h2">LEARNER SURFACE</text>
    <rect x="85" y="220" width="185" height="60" rx="16" fill="#DBEAFE"/>
    <text x="177" y="246" text-anchor="middle" class="h2">Question</text>
    <text x="177" y="268" text-anchor="middle" class="small">goal + prediction</text>
    <rect x="85" y="300" width="185" height="60" rx="16" fill="#CCFBF1"/>
    <text x="177" y="326" text-anchor="middle" class="h2">Controls</text>
    <text x="177" y="348" text-anchor="middle" class="small">variables + assumptions</text>
    <rect x="85" y="380" width="185" height="60" rx="16" fill="#FEF3C7"/>
    <text x="177" y="406" text-anchor="middle" class="h2">Views</text>
    <text x="177" y="428" text-anchor="middle" class="small">text + graph + simulation</text>
    <rect x="85" y="460" width="185" height="60" rx="16" fill="#F3E8FF"/>
    <text x="177" y="486" text-anchor="middle" class="h2">Explain</text>
    <text x="177" y="508" text-anchor="middle" class="small">reason + compare</text>
    <rect x="85" y="540" width="185" height="60" rx="16" fill="#FCE7F3"/>
    <text x="177" y="566" text-anchor="middle" class="h2">Transfer</text>
    <text x="177" y="588" text-anchor="middle" class="small">fresh case + creation</text>
    <text x="177" y="638" text-anchor="middle" class="small">keyboard • touch • voice • static</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="365" y="145" width="500" height="520" rx="26" fill="#FFFFFF" stroke="#0F766E" stroke-width="2"/>
    <text x="615" y="184" text-anchor="middle" class="h2">REACTIVE SEMANTIC GRAPH</text>
    <text x="615" y="208" text-anchor="middle" class="small">visible dependencies • deterministic order • no stale hidden state</text>

    <rect x="405" y="240" width="155" height="64" rx="17" fill="#DBEAFE"/>
    <text x="482" y="267" text-anchor="middle" class="h2">SOURCE</text>
    <text x="482" y="289" text-anchor="middle" class="small">span + version</text>
    <rect x="665" y="240" width="155" height="64" rx="17" fill="#DBEAFE"/>
    <text x="742" y="267" text-anchor="middle" class="h2">DEFINITION</text>
    <text x="742" y="289" text-anchor="middle" class="small">symbol + unit</text>

    <rect x="405" y="350" width="155" height="64" rx="17" fill="#CCFBF1"/>
    <text x="482" y="377" text-anchor="middle" class="h2">PARAMETER</text>
    <text x="482" y="399" text-anchor="middle" class="small">learner control</text>
    <rect x="665" y="350" width="155" height="64" rx="17" fill="#CCFBF1"/>
    <text x="742" y="377" text-anchor="middle" class="h2">COMPUTE</text>
    <text x="742" y="399" text-anchor="middle" class="small">code + data</text>

    <rect x="405" y="460" width="155" height="64" rx="17" fill="#FEF3C7"/>
    <text x="482" y="487" text-anchor="middle" class="h2">EXPLAIN</text>
    <text x="482" y="509" text-anchor="middle" class="small">dynamic prose</text>
    <rect x="665" y="460" width="155" height="64" rx="17" fill="#FEF3C7"/>
    <text x="742" y="487" text-anchor="middle" class="h2">VISUALIZE</text>
    <text x="742" y="509" text-anchor="middle" class="small">plot + diagram</text>

    <rect x="535" y="570" width="160" height="64" rx="17" fill="#F3E8FF"/>
    <text x="615" y="597" text-anchor="middle" class="h2">PRACTICE</text>
    <text x="615" y="619" text-anchor="middle" class="small">probe + transfer</text>

    <path d="M560 272L665 272" class="link"/>
    <path d="M742 304L742 350" class="link"/>
    <path d="M482 304L482 350" class="link"/>
    <path d="M560 382L665 382" class="link"/>
    <path d="M742 414L742 460" class="link"/>
    <path d="M665 492L560 492" class="link"/>
    <path d="M482 524C482 550 555 550 575 570" class="link"/>
    <path d="M742 524C742 550 675 550 655 570" class="link"/>
  </g>

  <path d="M300 405L365 405" class="link"/>

  <g filter="url(#shadow)">
    <rect x="925" y="145" width="220" height="270" rx="26" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="1035" y="184" text-anchor="middle" class="h2">VERIFICATION</text>
    <text x="1035" y="222" text-anchor="middle" class="body">source entailment</text>
    <text x="1035" y="252" text-anchor="middle" class="body">schema + types</text>
    <text x="1035" y="282" text-anchor="middle" class="body">tests + units</text>
    <text x="1035" y="312" text-anchor="middle" class="body">invariants</text>
    <text x="1035" y="342" text-anchor="middle" class="body">accessibility</text>
    <text x="1035" y="383" text-anchor="middle" class="small">status visible in the notebook</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="925" y="455" width="220" height="210" rx="26" fill="#FFFFFF" stroke="#A78BFA" stroke-width="2"/>
    <text x="1035" y="494" text-anchor="middle" class="h2">AI MENTOR</text>
    <text x="1035" y="532" text-anchor="middle" class="body">watches declared events</text>
    <text x="1035" y="562" text-anchor="middle" class="body">asks at useful moments</text>
    <text x="1035" y="592" text-anchor="middle" class="body">edits the graph visibly</text>
    <text x="1035" y="622" text-anchor="middle" class="body">records learner evidence</text>
  </g>

  <path d="M865 300L925 280" class="link"/>
  <path d="M865 520L925 540" class="link"/>
  <path d="M925 610C885 690 330 735 177 665" class="dashed"/>

  <text x="600" y="744" text-anchor="middle" class="body">Portable bundle: source + graph + runtime + tests + learner evidence + static fallback</text>
</svg>
