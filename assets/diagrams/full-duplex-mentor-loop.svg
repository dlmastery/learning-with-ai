<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Full-duplex multimodal mentor loop</title>
  <desc id="desc">A learner speaks, interrupts, points a camera, shares a screen, and manipulates a shared artifact. A continuous interaction policy decides many times per second whether to listen, acknowledge, speak, show, call a tool, wait, or escalate. Visual sampling, tools, learner-owned state, and local speech fallback surround the live model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#EAF4F6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#172554" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748B"/>
    </marker>
    <style>
      .h1{font:800 34px Inter,Arial,sans-serif;fill:#172554}
      .h2{font:800 19px Inter,Arial,sans-serif;fill:#172554}
      .body{font:500 15px Inter,Arial,sans-serif;fill:#334155}
      .small{font:600 13px Inter,Arial,sans-serif;fill:#475569}
      .pill{font:750 14px Inter,Arial,sans-serif;fill:#17324A}
      .link{fill:none;stroke:#64748B;stroke-width:3;marker-end:url(#arrow)}
      .bi{fill:none;stroke:#0F766E;stroke-width:5;marker-start:url(#arrow);marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="790" rx="30" fill="url(#bg)"/>
  <text x="60" y="62" class="h1">The mentor listens, sees, shows, speaks, waits, and acts continuously</text>
  <text x="60" y="94" class="body">Full duplex changes the interaction policy—not only the latency.</text>

  <g filter="url(#shadow)">
    <rect x="55" y="170" width="245" height="390" rx="28" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="177" y="210" text-anchor="middle" class="h2">LEARNER</text>
    <rect x="85" y="242" width="185" height="52" rx="15" fill="#DBEAFE"/>
    <text x="177" y="274" text-anchor="middle" class="pill">SPEAK + INTERRUPT</text>
    <rect x="85" y="310" width="185" height="52" rx="15" fill="#DBEAFE"/>
    <text x="177" y="342" text-anchor="middle" class="pill">SHOW WORK</text>
    <rect x="85" y="378" width="185" height="52" rx="15" fill="#DBEAFE"/>
    <text x="177" y="410" text-anchor="middle" class="pill">SHARE SCREEN</text>
    <rect x="85" y="446" width="185" height="52" rx="15" fill="#DBEAFE"/>
    <text x="177" y="478" text-anchor="middle" class="pill">MANIPULATE</text>
    <text x="177" y="532" text-anchor="middle" class="small">voice • touch • camera • text</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="405" y="145" width="390" height="440" rx="30" fill="#FFFFFF" stroke="#0F766E" stroke-width="3"/>
    <text x="600" y="188" text-anchor="middle" class="h2">CONTINUOUS MENTOR POLICY</text>
    <text x="600" y="213" text-anchor="middle" class="small">makes interaction decisions many times per second</text>
    <circle cx="600" cy="345" r="92" fill="#CCFBF1" stroke="#0F766E" stroke-width="3"/>
    <text x="600" y="328" text-anchor="middle" style="font:850 25px Inter,Arial,sans-serif;fill:#172554">LISTEN + THINK</text>
    <text x="600" y="357" text-anchor="middle" class="body">while speaking</text>
    <text x="600" y="382" text-anchor="middle" class="small">one coherent relationship</text>

    <rect x="440" y="470" width="95" height="42" rx="14" fill="#DBEAFE"/>
    <text x="487" y="496" text-anchor="middle" class="pill">ACK</text>
    <rect x="547" y="470" width="105" height="42" rx="14" fill="#FEF3C7"/>
    <text x="599" y="496" text-anchor="middle" class="pill">SPEAK</text>
    <rect x="664" y="470" width="95" height="42" rx="14" fill="#F3E8FF"/>
    <text x="711" y="496" text-anchor="middle" class="pill">SHOW</text>
    <rect x="467" y="527" width="112" height="38" rx="13" fill="#E7F4DD"/>
    <text x="523" y="551" text-anchor="middle" class="pill">WAIT</text>
    <rect x="592" y="527" width="140" height="38" rx="13" fill="#FCE7F3"/>
    <text x="662" y="551" text-anchor="middle" class="pill">CALL / HAND OFF</text>
  </g>

  <path d="M300 365L405 365" class="bi"/>

  <g filter="url(#shadow)">
    <rect x="900" y="130" width="245" height="110" rx="23" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="1022" y="168" text-anchor="middle" class="h2">VISUAL SAMPLER</text>
    <text x="1022" y="197" text-anchor="middle" class="body">camera • screen • document</text>
    <text x="1022" y="221" text-anchor="middle" class="small">crop + point + ask permission</text>

    <rect x="900" y="270" width="245" height="110" rx="23" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="1022" y="308" text-anchor="middle" class="h2">SHARED ARTIFACT</text>
    <text x="1022" y="337" text-anchor="middle" class="body">diagram • notebook • model</text>
    <text x="1022" y="361" text-anchor="middle" class="small">both can point and change</text>

    <rect x="900" y="410" width="245" height="110" rx="23" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
    <text x="1022" y="448" text-anchor="middle" class="h2">TOOL BUS</text>
    <text x="1022" y="477" text-anchor="middle" class="body">search • code • verifier</text>
    <text x="1022" y="501" text-anchor="middle" class="small">async result returns to flow</text>

    <rect x="900" y="550" width="245" height="110" rx="23" fill="#FFFFFF" stroke="#A78BFA" stroke-width="2"/>
    <text x="1022" y="588" text-anchor="middle" class="h2">LEARNER STATE</text>
    <text x="1022" y="617" text-anchor="middle" class="body">goal • evidence • language</text>
    <text x="1022" y="641" text-anchor="middle" class="small">permissioned + portable</text>
  </g>

  <path d="M795 265L900 190" class="link"/>
  <path d="M795 335L900 325" class="link"/>
  <path d="M795 420L900 465" class="link"/>
  <path d="M795 535L900 605" class="link"/>

  <g filter="url(#shadow)">
    <rect x="225" y="645" width="565" height="78" rx="22" fill="#172554"/>
    <text x="507" y="675" text-anchor="middle" style="font:800 19px Inter,Arial,sans-serif;fill:#FFFFFF">LOCAL CONTINUITY</text>
    <text x="507" y="701" text-anchor="middle" style="font:500 14px Inter,Arial,sans-serif;fill:#DCE7F5">on-device speech + curriculum + practice + queued escalation</text>
  </g>
  <path d="M405 550C350 580 320 610 350 645" class="link"/>
  <text x="600" y="759" text-anchor="middle" class="body">Visible state: listening • thinking • speaking • checking • waiting • reconnecting</text>
</svg>
