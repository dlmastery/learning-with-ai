<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio and comparative learning-system coverage matrix</title>
  <desc id="desc">Six groups of current learning projects are compared across verified knowledge, adaptive state, multimodal action, human network, local access, and transfer evidence. Each capability is demonstrated somewhere, but only the proposed universal mentor combines all six.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172554" flood-opacity=".12"/>
    </filter>
    <linearGradient id="mentor" x1="0" x2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <style>
      .title{font:700 34px Inter,Arial,sans-serif;fill:#172554}
      .sub{font:400 18px Inter,Arial,sans-serif;fill:#475569}
      .head{font:700 14px Inter,Arial,sans-serif;fill:#172554;letter-spacing:.4px}
      .row{font:700 16px Inter,Arial,sans-serif;fill:#172554}
      .note{font:400 13px Inter,Arial,sans-serif;fill:#64748B}
      .legend{font:600 14px Inter,Arial,sans-serif;fill:#334155}
      .bottom{font:700 17px Inter,Arial,sans-serif;fill:#fff}
    </style>
  </defs>

  <rect width="1400" height="900" fill="#FFFDF7"/>
  <circle cx="1300" cy="90" r="165" fill="#DBEAFE" opacity=".52"/>
  <circle cx="80" cy="845" r="150" fill="#CCFBF1" opacity=".5"/>

  <text x="70" y="62" class="title">EVERY COLUMN HAS AN EXISTENCE PROOF</text>
  <text x="70" y="95" class="sub">Late portfolio validation: current projects are complementary modules, not a winner-take-all ranking.</text>

  <g transform="translate(70 140)" filter="url(#shadow)">
    <rect width="1260" height="570" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

    <rect x="0" y="0" width="1260" height="82" rx="22" fill="#EFF6FF"/>
    <path d="M0 60 Q0 82 22 82 H1260 V60 Z" fill="#EFF6FF"/>

    <text x="30" y="34" class="head">PROJECT / SYSTEM GROUP</text>
    <text x="400" y="27" text-anchor="middle" class="head">VERIFIED</text>
    <text x="400" y="47" text-anchor="middle" class="head">KNOWLEDGE</text>
    <text x="560" y="27" text-anchor="middle" class="head">ADAPTIVE</text>
    <text x="560" y="47" text-anchor="middle" class="head">STATE</text>
    <text x="720" y="27" text-anchor="middle" class="head">MULTIMODAL</text>
    <text x="720" y="47" text-anchor="middle" class="head">ACTION</text>
    <text x="880" y="27" text-anchor="middle" class="head">HUMAN</text>
    <text x="880" y="47" text-anchor="middle" class="head">NETWORK</text>
    <text x="1040" y="27" text-anchor="middle" class="head">LOCAL</text>
    <text x="1040" y="47" text-anchor="middle" class="head">ACCESS</text>
    <text x="1190" y="27" text-anchor="middle" class="head">TRANSFER</text>
    <text x="1190" y="47" text-anchor="middle" class="head">EVIDENCE</text>

    <g stroke="#E2E8F0" stroke-width="1">
      <line x1="0" y1="82" x2="1260" y2="82"/>
      <line x1="0" y1="162" x2="1260" y2="162"/>
      <line x1="0" y1="242" x2="1260" y2="242"/>
      <line x1="0" y1="322" x2="1260" y2="322"/>
      <line x1="0" y1="402" x2="1260" y2="402"/>
      <line x1="0" y1="482" x2="1260" y2="482"/>
      <line x1="330" y1="0" x2="330" y2="570"/>
      <line x1="480" y1="0" x2="480" y2="570"/>
      <line x1="640" y1="0" x2="640" y2="570"/>
      <line x1="800" y1="0" x2="800" y2="570"/>
      <line x1="960" y1="0" x2="960" y2="570"/>
      <line x1="1120" y1="0" x2="1120" y2="570"/>
    </g>

    <g>
      <text x="30" y="115" class="row">dlmastery portfolio</text>
      <text x="30" y="138" class="note">authoring · live tutor · media · memory · eval</text>
      <circle cx="400" cy="122" r="15" fill="#0F766E"/>
      <circle cx="560" cy="122" r="15" fill="#D97706"/>
      <circle cx="720" cy="122" r="15" fill="#0F766E"/>
      <circle cx="880" cy="122" r="15" fill="#D97706"/>
      <circle cx="1040" cy="122" r="15" fill="#D97706"/>
      <circle cx="1190" cy="122" r="15" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>

      <text x="30" y="195" class="row">Harness-engineering book</text>
      <text x="30" y="218" class="note">skills · cases · reflection · durable artifacts</text>
      <circle cx="400" cy="202" r="15" fill="#0F766E"/>
      <circle cx="560" cy="202" r="15" fill="#D97706"/>
      <circle cx="720" cy="202" r="15" fill="#D97706"/>
      <circle cx="880" cy="202" r="15" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
      <circle cx="1040" cy="202" r="15" fill="#0F766E"/>
      <circle cx="1190" cy="202" r="15" fill="#D97706"/>

      <text x="30" y="275" class="row">Google + Khanmigo</text>
      <text x="30" y="298" class="note">compiled lessons · diagnostics · mastery graph</text>
      <circle cx="400" cy="282" r="15" fill="#0F766E"/>
      <circle cx="560" cy="282" r="15" fill="#0F766E"/>
      <circle cx="720" cy="282" r="15" fill="#0F766E"/>
      <circle cx="880" cy="282" r="15" fill="#D97706"/>
      <circle cx="1040" cy="282" r="15" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
      <circle cx="1190" cy="282" r="15" fill="#D97706"/>

      <text x="30" y="355" class="row">LessonOrca + Tutor CoPilot</text>
      <text x="30" y="378" class="note">human continuity · parent view · expert moves</text>
      <circle cx="400" cy="362" r="15" fill="#D97706"/>
      <circle cx="560" cy="362" r="15" fill="#D97706"/>
      <circle cx="720" cy="362" r="15" fill="#D97706"/>
      <circle cx="880" cy="362" r="15" fill="#0F766E"/>
      <circle cx="1040" cy="362" r="15" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
      <circle cx="1190" cy="362" r="15" fill="#0F766E"/>

      <text x="30" y="435" class="row">DeepTutor + Open TutorAI</text>
      <text x="30" y="458" class="note">agent memory · source grounding · self-hosting</text>
      <circle cx="400" cy="442" r="15" fill="#0F766E"/>
      <circle cx="560" cy="442" r="15" fill="#0F766E"/>
      <circle cx="720" cy="442" r="15" fill="#0F766E"/>
      <circle cx="880" cy="442" r="15" fill="#D97706"/>
      <circle cx="1040" cy="442" r="15" fill="#0F766E"/>
      <circle cx="1190" cy="442" r="15" fill="#D97706"/>

      <text x="30" y="515" class="row">Kolibri</text>
      <text x="30" y="538" class="note">offline-first content · progress · facilitator</text>
      <circle cx="400" cy="522" r="15" fill="#0F766E"/>
      <circle cx="560" cy="522" r="15" fill="#D97706"/>
      <circle cx="720" cy="522" r="15" fill="#D97706"/>
      <circle cx="880" cy="522" r="15" fill="#0F766E"/>
      <circle cx="1040" cy="522" r="15" fill="#0F766E"/>
      <circle cx="1190" cy="522" r="15" fill="#D97706"/>
    </g>
  </g>

  <g transform="translate(70 745)">
    <circle cx="15" cy="15" r="13" fill="#0F766E"/>
    <text x="40" y="20" class="legend">demonstrated</text>
    <circle cx="195" cy="15" r="13" fill="#D97706"/>
    <text x="220" y="20" class="legend">partial / emerging / provider-bound</text>
    <circle cx="520" cy="15" r="13" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <text x="545" y="20" class="legend">not visible publicly; not proof of absence</text>
  </g>

  <rect x="70" y="800" width="1260" height="70" rx="35" fill="url(#mentor)" filter="url(#shadow)"/>
  <text x="320" y="842" class="bottom">UNIVERSAL MENTOR</text>
  <g fill="#34D399" stroke="#fff" stroke-width="3">
    <circle cx="550" cy="835" r="15"/>
    <circle cx="700" cy="835" r="15"/>
    <circle cx="850" cy="835" r="15"/>
    <circle cx="1000" cy="835" r="15"/>
    <circle cx="1150" cy="835" r="15"/>
    <circle cx="1270" cy="835" r="15"/>
  </g>
  <path d="M535 835 l9 9 16-19 M685 835 l9 9 16-19 M835 835 l9 9 16-19 M985 835 l9 9 16-19 M1135 835 l9 9 16-19 M1255 835 l9 9 16-19" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="70" y="894" class="note">STATUS REFLECTS INSPECTED PUBLIC SURFACES AS OF 25 JULY 2026 · THE OPPORTUNITY IS COMPOSITION</text>
</svg>
