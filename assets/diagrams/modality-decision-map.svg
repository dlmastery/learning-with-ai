<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">Decision map for choosing educational visual modalities</title>
  <desc id="desc">The mentor starts with the learner action and chooses the lightest medium that preserves the claim: annotate an existing artifact, step through an animation, manipulate an executable simulation, generate a situated video, or perform a real-world activity. All routes return learner evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07152f"/><stop offset="1" stop-color="#153e5d"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020914" flood-opacity=".5"/></filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77dfcb"/></marker>
    <style>
      .h{font:700 34px Inter,Segoe UI,sans-serif;fill:#f8fbff}.sub{font:400 17px Inter,Segoe UI,sans-serif;fill:#bed0e3}
      .k{font:700 12px Inter,Segoe UI,sans-serif;letter-spacing:1px;fill:#83ead6}.t{font:700 19px Inter,Segoe UI,sans-serif;fill:#f8fbff}
      .b{font:400 14px Inter,Segoe UI,sans-serif;fill:#d9e6f1}.dark{font:700 20px Inter,Segoe UI,sans-serif;fill:#102840}.ds{font:400 14px Inter,Segoe UI,sans-serif;fill:#36546e}
    </style>
  </defs>
  <rect width="1200" height="850" rx="34" fill="url(#bg)"/>
  <text x="65" y="68" class="h">Choose motion from the learning action—not the spectacle</text>
  <text x="65" y="102" class="sub">Use the lightest medium that preserves truth, invites intervention, and works on the learner’s device.</text>
  <g filter="url(#s)">
    <rect x="410" y="145" width="380" height="118" rx="25" fill="#fffdf7" stroke="#ffc857" stroke-width="3"/>
    <text x="463" y="185" class="k" fill="#157268">START WITH THE LEARNER</text>
    <text x="455" y="222" class="dark">What must they notice or change?</text>
  </g>
  <path d="M600 263 V318" stroke="#77dfcb" stroke-width="4" marker-end="url(#a)"/>

  <g filter="url(#s)">
    <rect x="55" y="360" width="205" height="165" rx="23" fill="#173f66" stroke="#5288b4"/>
    <text x="78" y="395" class="k">ANNOTATE</text><text x="78" y="432" class="t">Point at their work</text>
    <text x="78" y="462" class="b">circle · trace · label</text><text x="78" y="487" class="b">lowest bandwidth</text>
    <rect x="275" y="360" width="205" height="165" rx="23" fill="#173f66" stroke="#5288b4"/>
    <text x="298" y="395" class="k">STEP</text><text x="298" y="432" class="t">Controlled animation</text>
    <text x="298" y="462" class="b">pause · predict · scrub</text><text x="298" y="487" class="b">known state sequence</text>
    <rect x="495" y="360" width="205" height="165" rx="23" fill="#164457" stroke="#55a99d"/>
    <text x="518" y="395" class="k">MANIPULATE</text><text x="518" y="432" class="t">Executable simulation</text>
    <text x="518" y="462" class="b">change parameters</text><text x="518" y="487" class="b">test causal model</text>
    <rect x="715" y="360" width="205" height="165" rx="23" fill="#3b2d46" stroke="#c38fd1"/>
    <text x="738" y="395" class="k" fill="#e8b7f4">SITUATE</text><text x="738" y="432" class="t">Generated video</text>
    <text x="738" y="462" class="b">scene · story · perspective</text><text x="738" y="487" class="b">source + shot checks</text>
    <rect x="935" y="360" width="210" height="165" rx="23" fill="#4b3d22" stroke="#dda94c"/>
    <text x="958" y="395" class="k" fill="#ffd47c">DO</text><text x="958" y="432" class="t">Real-world activity</text>
    <text x="958" y="462" class="b">build · measure · move</text><text x="958" y="487" class="b">human/physical feedback</text>
  </g>
  <path d="M600 318 C451 320 235 317 158 350 M600 318 C500 324 420 328 378 350 M600 318 V350 M600 318 C700 324 780 328 818 350 M600 318 C749 320 967 317 1040 350" fill="none" stroke="#77dfcb" stroke-width="3" marker-end="url(#a)"/>

  <rect x="90" y="610" width="1020" height="125" rx="25" fill="#0b223d" stroke="#345874"/>
  <text x="120" y="647" class="k">EVERY ROUTE RETURNS EVIDENCE</text>
  <text x="120" y="684" class="t">predict · intervene · explain · reconstruct · transfer</text>
  <text x="120" y="714" class="b">If the learner only watches, the mentor has not finished authoring the experience.</text>
  <path d="M600 610 V545" stroke="#ffc857" stroke-width="4" marker-end="url(#a)"/>
</svg>
